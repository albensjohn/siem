<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SENTINEL SIEM — v4.0.2</title>
  <meta name="description" content="SENTINEL SIEM — Advanced Security Information and Event Management Dashboard" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>

<body>

  <!-- Boot Loader -->
  <div id="boot-loader">
    <div class="boot-inner">
      <div class="boot-header">
        <div class="boot-logo">
          <div class="boot-logo-icon">S</div>
          <div class="boot-logo-text">SENTINEL_SYS</div>
        </div>
        <div class="boot-status">BOOT_SEQUENCE_ACTIVE</div>
      </div>
      <div class="boot-log-box" id="boot-log-box"></div>
      <div class="boot-progress-label">
        <span>Loading Modules</span>
        <span id="boot-progress-pct">0%</span>
      </div>
      <div class="boot-progress-track">
        <div class="boot-progress-bar" id="boot-progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- Background Grid -->
  <div id="bg-grid"></div>

  <!-- Sidebar -->
  <aside id="sidebar"></aside>

  <!-- App Shell -->
  <div id="app-shell">
    <!-- Top Bar -->
    <header id="topbar"></header>

    <!-- Page Header -->
    <div id="page-header">
      <div class="page-header-inner">
        <div class="page-accent-bar"></div>
        <h1 id="page-title">nexus</h1>
      </div>
    </div>
  </div>

  <!-- Tab Content -->
  <main id="tab-content"></main>
  </div>

  <!-- Footer -->
  <footer id="footer"></footer>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- App JS -->
  <script src="app.js"></script>
</body>

</html>
